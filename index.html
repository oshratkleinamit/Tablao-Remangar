.result-card.ok{border-color:#22c55e}.result-card.err{border-color:#c41e1e}.result-card.warn{border-color:#f59e0b}

<script>

4"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0026.pdf"}, {"name": "אדי בלן", "email": "balan.adi2@gmail.com", "tickets": ["0027-01", "0027-02"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0027.pdf"}, {"name": "סיון סלוקי", "email": "sivansluki@gmail.com", "tickets": ["0028-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0028.pdf"}, {"name": "טל רונג", "email": "Talrong1@yahoo.com", "tickets": ["0029-01", "0029-02"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0029.pdf"}, {"name": "אופיר חנינה", "email": "haninaofir@gmail.com", "tickets": ["0030-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0030.pdf"}, {"name": "אמיר הירשברג", "email": "amir.hirshberg@gmail.com", "tickets": ["0031-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0031.pdf"}, {"name": "רונן חסון", "email": "ronenh@gmail.com", "tickets": ["0032-01", "0032-02"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0032.pdf"}, {"name": "איריס יפה גודר", "email": "irisyaffe@gmail.com", "tickets": ["0033-01", "0033-02"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0033.pdf"}, {"name": "לאה מזרחי", "email": "leah3164@gmail.com", "tickets": ["0034-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0034.pdf"}, {"name": "רעות עדני", "email": "", "tickets": ["0035-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0035.pdf"}, {"name": "Miguel Angel", "email": "", "tickets": ["0036-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0036.pdf"}, {"name": "Shani Livne", "email": "", "tickets": ["0037-01"], "file": "/home/claude/tickets_tablao261126/TABLAO_Ticket_0037.pdf"}];

const ticketMap = {};
GUESTS.forEach(g => g.tickets.forEach(t => ticketMap[t] = g));

let scanned = {};
let firebaseOK = true;
let scanner = null;
let scanning = false;

function loadLocal() {
  try { scanned = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { scanned = {}; }
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(scanned)); } catch(e) {}
}

async function fbLoad() {
  try {
    const r = await fetch(`${FIREBASE_URL}/${FIREBASE_PATH}.json`);
    if (!r.ok) throw new Error();
    const d = await r.json();
    if (d) Object.assign(scanned, d);
    firebaseOK = true;
    document.getElementById('offline-banner').style.display='none';
  } catch(e) {
    firebaseOK = false;
    document.getElementById('offline-banner').style.display='block';
  }
}
async function fbSave(ticketId, data) {
  try {
    await fetch(`${FIREBASE_URL}/${FIREBASE_PATH}/${ticketId}.json`, {method:'PUT', body:JSON.stringify(data)});
  } catch(e) { firebaseOK=false; document.getElementById('offline-banner').style.display='block'; }
}

function markTicket(ticketId) {
  const guest = ticketMap[ticketId];
  if (!guest) return showResult('err','❌','כרטיס לא מוכר',`מספר: ${ticketId}`);
  if (scanned[ticketId]) return showResult('warn','⚠️',guest.name,`כבר נסרק קודם!<br>מספר: ${ticketId}`);
  const data = {name:guest.name, time:new Date().toISOString()};
  scanned[ticketId] = data;
  saveLocal();
  fbSave(ticketId, data);
  updateStats();
  renderGuests();
  const arrivedCount = guest.tickets.filter(t=>scanned[t]).length;
  showResult('ok','✅',guest.name,`${ticketId} נסרק בהצלחה<br>${arrivedCount}/${guest.tickets.length} כרטיסים הגיעו`);
}

function updateStats() {
  const a = Object.keys(scanned).length;
  document.getElementById('cnt-arrived').textContent = a;
  document.getElementById('cnt-pending').textContent = 57 - a;
}

function showResult(type, icon, name, info) {
  const card = document.getElementById('result-card');
  card.className = 'result-card ' + type;
  document.getElementById('res-icon').textContent = icon;
  document.getElementById('res-name').textContent = name;
  document.getElementById('res-info').innerHTML = info;
  document.getElementById('result-modal').classList.add('show');
  if(type==='ok') setTimeout(closeResult, 2500);
}
function closeResult() {
  document.getElementById('result-modal').classList.remove('show');
  if(scanning) { scanning=false; if(scanner){scanner.stop().catch(()=>{});scanner=null;} document.getElementById('reader').innerHTML=''; document.getElementById('scan-btn').textContent='📷 פתחי מצלמה לסריקה'; }
}

function startScan() {
  if(scanning) { scanning=false; if(scanner){scanner.stop().catch(()=>{});scanner=null;} document.getElementById('reader').innerHTML=''; document.getElementById('scan-btn').textContent='📷 פתחי מצלמה לסריקה'; return; }
  scanning=true;
  document.getElementById('scan-btn').textContent='⏹ עצרי סריקה';
  scanner = new Html5Qrcode("reader");
  scanner.start({facingMode:"environment"},{fps:10,qrbox:220},
    qrText => { const parts=qrText.split('|'); markTicket(parts.length>=2?parts[1]:qrText); },
    ()=>{}
  ).catch(()=>{ document.getElementById('scan-btn').textContent='📷 פתחי מצלמה לסריקה'; scanning=false; });
}

function checkManual() {
  const v = document.getElementById('manual-input').value.trim();
  if(v) { markTicket(v); document.getElementById('manual-input').value=''; }
}
document.getElementById('manual-input').addEventListener('keydown', e=>{ if(e.key==='Enter') checkManual(); });

function filterGuests(q) { renderGuests(q); }
function renderGuests(q='') {
  const list = document.getElementById('guest-list');
  const filtered = GUESTS.filter(g=>!q||g.name.includes(q));
  list.innerHTML = filtered.map(g => {
    const arrived = g.tickets.filter(t=>scanned[t]).length;
    const allArrived = arrived===g.tickets.length;
    return `<div class="guest-row">
      <div class="guest-info">
        <div class="g-name" style="color:${allArrived?'#22c55e':'#fff'}">${g.name}</div>
        <div class="g-sub">${arrived}/${g.tickets.length} כרטיסים · ${g.tickets.join(', ')}</div>
      </div>
      <div class="g-status">
        ${g.tickets.map(t=>`<button class="btn-mark ${scanned[t]?'arrived':''}" onclick="markTicket('${t}')">${t}</button>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function logout() { if(confirm('לצאת ממסך הכניסה?')) location.reload(); }

async function init() {
  loadLocal();
  await fbLoad();
  updateStats();
  renderGuests();
}
init();
</script>

</html>
